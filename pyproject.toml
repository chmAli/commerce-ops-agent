[project]
name = "commerce-ops-agent"
version = "0.1.0"
description = "LLM agent and MCP server for e-commerce operations questions"
readme = "README.md"
authors = [
    { name = "Muhammad Ali Shan", email = "chmalishan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3.0",
    "mcp[cli]>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[project.scripts]
commerce-ops-agent = "commerce_ops_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
